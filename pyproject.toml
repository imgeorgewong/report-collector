[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-collector"
version = "0.1.0"
description = "Registry-driven collector for publicly available reports, with a per-issue manifest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
truststore = ["truststore>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]
