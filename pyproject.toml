[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-collector"
version = "0.1.0"
description = "Registry-driven collector for publicly available reports, with a per-issue manifest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# No dependencies, on purpose. This has to run on machines where installing a package is a
# negotiation, so everything - HTTP, robots.txt, HTML parsing, text extraction - is standard
# library only.
dependencies = []

[project.scripts]
report-collector = "report_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
